<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User & Phone / VIP Gift Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #3b2c26;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 16px;
      min-height: 100vh;
      position: relative;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background-color: #4a372f;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      margin-bottom: 50px;
    }
    .search-bar {
      display: flex;
      align-items: center;
      background-color: #3b2c26;
      border: 1px solid #7d6355;
      border-radius: 20px;
      padding: 6px 14px;
      margin-bottom: 20px;
    }
    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      width: 100%;
      font-size: 14px;
    }

    .tiktok-img {
      height: 38px;
      width: auto;
      object-fit: contain;
      margin-left: 8px;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .btn-reset-floating {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background-color: rgba(60, 50, 45, 0.6);
      color: #a89082;
      border: 1px solid #5a443a;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.2s ease;
      z-index: 9999;
    }
    .btn-reset-floating:hover {
      opacity: 1;
      background-color: #7d2626;
      color: #fff;
      border-color: #7d2626;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px 12px 10px;
      border-bottom: 1px solid #5a443a;
      border-radius: 8px;
      animation: fadeIn 0.3s ease-in-out;
      position: relative;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .item.vip-exclusive {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(74, 55, 47, 0.8));
      border: 1px solid #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      border: 1px solid #a89082;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #d1c2ba;
      flex-shrink: 0;
    }
    .user-name {
      font-size: 16px;
      font-weight: bold;
      font-family: 'Georgia', serif;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .heart-icon {
      font-size: 9px; 
      line-height: 1;
    }
    
    .vip-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      font-family: Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .vip-lvl-1 { background: linear-gradient(45deg, #ffd700, #ffa500); color: #000; box-shadow: 0 0 5px rgba(255, 215, 0, 0.6); }
    .vip-lvl-2 { background: linear-gradient(45deg, #00f2fe, #4facfe); color: #000; box-shadow: 0 0 8px rgba(0, 242, 254, 0.8); }
    .vip-lvl-3 { background: linear-gradient(45deg, #ff0844, #ffb199); color: #fff; box-shadow: 0 0 10px rgba(255, 8, 68, 0.9); }
    .vip-lvl-4 { background: linear-gradient(45deg, #b224ef, #7579ff); color: #fff; box-shadow: 0 0 12px rgba(178, 36, 239, 1); }
    .vip-lvl-5 { background: linear-gradient(45deg, #00ff87, #60efff); color: #000; box-shadow: 0 0 15px rgba(0, 255, 135, 1); }
    .vip-lvl-6 { background: linear-gradient(45deg, #f12711, #f5af19); color: #fff; box-shadow: 0 0 15px #f5af19; }
    .vip-lvl-7 { background: linear-gradient(45deg, #b92b27, #1565c0); color: #fff; box-shadow: 0 0 16px #1565c0; }
    .vip-lvl-8 { background: linear-gradient(45deg, #3a1c71, #d76d77, #ffaf7b); color: #fff; box-shadow: 0 0 18px #d76d77; }
    .vip-lvl-9 { background: linear-gradient(45deg, #0e1c26, #2a5298, #00c6ff); color: #fff; box-shadow: 0 0 20px #00c6ff; }
    .vip-lvl-10 { background: linear-gradient(45deg, #f80759, #bc4e9c, #00f2fe); color: #fff; box-shadow: 0 0 22px #f80759; animation: pulseGlow 1.2s infinite alternate; }

    .vip-lvl-god { 
      background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #8b00ff); 
      background-size: 300% 300%;
      color: #fff; 
      text-shadow: 0 0 3px #000;
      box-shadow: 0 0 25px rgba(255,255,255,0.9); 
      animation: rainbowGlow 2s ease infinite; 
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 0 10px #f80759; }
      to { box-shadow: 0 0 22px #00f2fe; }
    }
    @keyframes rainbowGlow {
      0% { background-position: 0% 50%; box-shadow: 0 0 15px #ff0000; }
      50% { background-position: 100% 50%; box-shadow: 0 0 25px #00ff00; }
      100% { background-position: 0% 50%; box-shadow: 0 0 15px #0000ff; }
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 55%;
    }

    .product-img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      background-color: transparent;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6));
      flex-shrink: 0;
    }
    .product-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .exclusive-tag {
      font-size: 9px;
      color: #ffd700;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .brand {
      font-size: 11px;
      color: #a89082;
    }
    .model {
      font-size: 13px;
      font-weight: bold;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 480px) {
      .container { padding: 12px; }
      .product-img { width: 50px; height: 50px; }
      .user-name { font-size: 15px; }
      .model { font-size: 12px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="search-bar">
      <input type="text" id="usernameInput" placeholder="Please comment your name (e.g. John+10 or press \)..." onkeydown="handleKeyDown(event)" onkeyup="handleKeyUp(event)">
      <img src="images/lovetiktok.png" alt="TikTok" class="tiktok-img" onerror="this.style.display='none'">
    </div>

    <div class="item-list" id="itemList"></div>
  </div>

  <button class="btn-reset-floating" onclick="resetAllData()">Reset Data</button>

  <script>
    const phoneDatabase = [
      { brand: "OPPO", model: "Find X6 Pro 512GB", img: "images/FindX6Pro512GB.png" },
      { brand: "OPPO", model: "Find X7 Ultra 512GB", img: "images/FindX7Ultra512GB.png" },
      { brand: "OPPO", model: "Find X9 Pro 512GB", img: "images/FindX9Pro512GB.png" },
      { brand: "OPPO", model: "Find X9 Ultra 1TB", img: "images/FindX9Ultra1TB.png" },
      { brand: "Samsung", model: "Galaxy S23 Ultra 256GB", img: "images/GalaxyS23Ultra256GB.png" },
      { brand: "Samsung", model: "Galaxy S24 Ultra 512GB", img: "images/GalaxyS24Ultra512GB.png" },
      { brand: "Samsung", model: "Galaxy S25 Ultra 512GB", img: "images/GalaxyS25Ultra512GB.png" },
      { brand: "Samsung", model: "Galaxy S26 Ultra 1TB", img: "images/GalaxyS26Ultra1TB.png" },
      { brand: "Huawei", model: "Mate 80 Pro 1TB", img: "images/Mate80Pro1TB.png" },
      { brand: "Huawei", model: "Mate X6 512GB", img: "images/MateX6512GB.png" },
      { brand: "Huawei", model: "Mate X7 512GB", img: "images/MateX7512GB.png" },
      { brand: "Huawei", model: "Pura 70 Ultra 512GB", img: "images/Pura70Ultra512GB.png" },
      { brand: "Huawei", model: "Pura 80 Ultra 512GB", img: "images/Pura80Ultra512GB.png" },
      { brand: "Xiaomi", model: "Xiaomi 13T Pro 512GB", img: "images/Xiaomi13TPro512GB.png" },
      { brand: "Xiaomi", model: "Xiaomi 14 Ultra 512GB", img: "images/Xiaomi14Ultra512GB.png" },
      { brand: "Xiaomi", model: "Xiaomi 15 Ultra 512GB", img: "images/Xiaomi15Ultra512GB.png" },
      { brand: "Xiaomi", model: "Xiaomi 17T Pro 512GB", img: "images/Xiaomi17TPro512GB.png" },
      { brand: "Xiaomi", model: "Xiaomi 17 Ultra 1TB", img: "images/Xiaomi17Ultra1TB.png" },
      { brand: "Apple", model: "iPhone 15 Pro Max 256GB", img: "images/iPhone15ProMax256GB.png" },
      { brand: "Apple", model: "iPhone 16 Pro Max 512GB", img: "images/iPhone16ProMax512GB.png" },
      { brand: "Apple", model: "iPhone 17 Pro 256GB", img: "images/iPhone17Pro256GB.png" },
      { brand: "Apple", model: "iPhone 17 Pro Max 512GB", img: "images/iPhone17ProMax512GB.png" },
      { brand: "Apple", model: "iPhone Air 256GB", img: "images/iPhoneAir256GB.png" }
    ];

    const vipGiftDatabase = [
      { brand: "Apple", model: "MacBook Pro 14 M5 1TB", img: "images/MacBookPro14M51TB.png" },
      { brand: "ASUS ROG", model: "Strix G16 RTX 5060", img: "images/ROGStrixG16RTX5060.png" },
      { brand: "Lenovo", model: "Legion 5 RTX 5070", img: "images/LenovoLegion5RTX5070.png" },
      { brand: "ASUS ROG", model: "Strix G18 RTX 5070", img: "images/ROGStrixG18RTX5070.png" },
      { brand: "Gigabyte", model: "AERO X16 RTX 5070", img: "images/GigabyteAEROX16RTX5070.png" },
      { brand: "Dell", model: "XPS 16 RTX 4060", img: "images/DellXPS16RTX4060.png" },
      { brand: "MSI", model: "Prestige 14 Flip AI 1TB", img: "images/MSIPrestige14FlipAI1TB.png" },
      { brand: "LG", model: "OLED TV 65 Inch", img: "images/LGOLEDTV65.png" },
      { brand: "Samsung", model: "OLED TV 65 Inch", img: "images/SamsungOLEDTV65.png" },
      { brand: "Custom PC", model: "Gaming RTX 5080", img: "images/PCGamingRTX5080.png" }
    ];

    let currentNumber = parseInt(localStorage.getItem('currentNumber')) || 100;
    let userCounts = JSON.parse(localStorage.getItem('userCounts')) || {};
    let savedList = JSON.parse(localStorage.getItem('savedList')) || [];
    let lastEnteredUser = localStorage.getItem('lastEnteredUser') || "";

    window.onload = function() {
      renderSavedList();
    };

    function saveData() {
      localStorage.setItem('currentNumber', currentNumber);
      localStorage.setItem('userCounts', JSON.stringify(userCounts));
      localStorage.setItem('savedList', JSON.stringify(savedList));
      localStorage.setItem('lastEnteredUser', lastEnteredUser);
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        submitUser();
      } else if (event.key === '\\') {
        event.preventDefault();
        if (lastEnteredUser !== "") {
          processAddUser(lastEnteredUser, 5);
        }
      }
    }

    function handleKeyUp(event) {
      if (event.key === 'Enter') {
        const input = document.getElementById('usernameInput');
        input.value = "";
      }
    }

    function submitUser() {
      const input = document.getElementById('usernameInput');
      const rawValue = input.value.trim();

      if (rawValue !== "") {
        let username = rawValue;
        let addBonus = 0;

        const bonusMatch = rawValue.match(/^(.*?)\s*\+(\d+)$/);
        if (bonusMatch) {
          username = bonusMatch[1].trim();
          addBonus = parseInt(bonusMatch[2], 10);
        }

        if (username !== "") {
          lastEnteredUser = username;
          processAddUser(username, 1 + addBonus);
        }
      }

      input.value = "";
      setTimeout(() => { input.value = ""; }, 20);
    }

    function toRoman(num) {
      const lookup = { M: 1000, CM: 900, D: 500, CD: 400, C: 100, XC: 90, L: 50, XL: 40, X: 10, IX: 9, V: 5, IV: 4, I: 1 };
      let roman = '';
      for (let i in lookup) {
        while (num >= lookup[i]) {
          roman += i;
          num -= lookup[i];
        }
      }
      return roman;
    }

    function calculateVipLevel(count) {
      if (count < 15) return 0;
      if (count < 75) {
        return 1 + Math.floor((count - 15) / 15);
      } else if (count < 170) {
        return 5 + Math.floor((count - 75) / 20);
      } else {
        return 10 + Math.floor((count - 170) / 25);
      }
    }

    function getStatusBadge(count) {
      if (count < 5) return "";
      if (count >= 5 && count < 10) return `<span class="heart-icon">❣️</span>`;
      if (count >= 10 && count < 15) return `<span class="heart-icon">❣️💙</span>`;

      const vipLevelNum = calculateVipLevel(count);
      const romanNum = toRoman(vipLevelNum);
      let vipClass = `vip-lvl-${vipLevelNum}`;
      if (vipLevelNum > 10) vipClass = "vip-lvl-god";

      return `<span class="vip-badge ${vipClass}">VIP ${romanNum}</span>`;
    }

    function processAddUser(username, incrementCount) {
      userCounts[username] = (userCounts[username] || 0) + incrementCount;
      const count = userCounts[username];
      const vipLevel = calculateVipLevel(count);

      let selectedGift;
      let isVipExclusive = false;

      if (vipLevel >= 5) {
        selectedGift = vipGiftDatabase[Math.floor(Math.random() * vipGiftDatabase.length)];
        isVipExclusive = true;
      } else {
        selectedGift = phoneDatabase[Math.floor(Math.random() * phoneDatabase.length)];
      }

      const itemData = {
        number: currentNumber,
        username: username,
        gift: selectedGift,
        isVipExclusive: isVipExclusive
      };

      savedList.unshift(itemData);
      currentNumber++;

      saveData();
      renderSavedList();
    }

    function renderSavedList() {
      const itemList = document.getElementById('itemList');
      itemList.innerHTML = "";

      savedList.forEach(item => {
        const count = userCounts[item.username] || 0;
        const statusBadge = getStatusBadge(count);
        const vipLevel = calculateVipLevel(count);
        
        const isExclusive = vipLevel >= 5;

        const itemDiv = document.createElement('div');
        itemDiv.className = `item ${isExclusive ? 'vip-exclusive' : ''}`;
        itemDiv.innerHTML = `
          <div class="item-left">
            <div class="badge">${item.number}</div>
            <div class="user-name">${item.username} ${statusBadge}</div>
          </div>
          <div class="item-right">
            <img class="product-img" src="${item.gift.img}" alt="${item.gift.brand}" onerror="this.src='https://via.placeholder.com/58/transparent/fff?text=Gift'">
            <div class="product-info">
              ${isExclusive ? '<span class="exclusive-tag">★ VIP GIFT ★</span>' : ''}
              <span class="brand">${item.gift.brand}</span>
              <span class="model" title="${item.gift.model}">${item.gift.model}</span>
            </div>
          </div>
        `;
        itemList.appendChild(itemDiv);
      });
    }

    function resetAllData() {
      if (confirm("Reset all data and clear storage?")) {
        localStorage.clear();
        currentNumber = 100;
        userCounts = {};
        savedList = [];
        lastEnteredUser = "";
        renderSavedList();
      }
    }
  </script>
</body>
</html>
